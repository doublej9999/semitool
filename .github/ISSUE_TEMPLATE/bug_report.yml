name: Bug report
description: A calculation result, import or UI behavior is wrong.
labels: ["bug"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - A calculator (wrong or suspicious result)
        - Data import (STDF / KLARF / CSV)
        - Export (CSV / XLSX / PDF / SVG)
        - Fab Workspace / session (film stack, genealogy, flows)
        - Shell (shortcuts, theme, search, sidebar)
        - Offline / PWA
        - Other / not sure
    validations:
      required: true
  - type: input
    id: tool
    attributes:
      label: Tool / page
      placeholder: e.g. /tools/wafer-die-calculator
    validations:
      required: true
  - type: textarea
    id: inputs
    attributes:
      label: Inputs (with units)
      placeholder: |
        wafer diameter 300 mm, die 10 x 10 mm, street 0.1 mm, edge exclusion 3 mm
      validations:
        required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result (and its source)
      placeholder: |
        53,412 gross die — cross-checked against <reference or another tool>
      validations:
        required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
      validations:
        required: true
  - type: input
    id: browser
    attributes:
      label: Browser / OS
      placeholder: e.g. Chrome 140 / Windows 11
  - type: checkboxes
    id: confidentiality
    attributes:
      label: Confidentiality
      options:
        - label: I understand this is a public issue and have NOT pasted confidential wafer/production data (synthetic examples only).
          required: true
